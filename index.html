<style>
:root{--bg:#f4f6fb;--card:#fff;--tx:#0f172a;--mut:#64748b;--bd:#e2e8f0;--pri:#4f46e5;--pri2:#eef2ff;--ok:#047857;--okbg:#d1fae5;--bad:#b91c1c;--badbg:#fee2e2;--warn:#b45309;--warnbg:#fef3c7;--sh:0 1px 3px rgba(15,23,42,.08),0 6px 18px rgba(15,23,42,.05)}

body{margin:0;font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx)}

.btn:hover{border-color:var(--pri)}.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff}.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}[data-theme=dark] .btn.ok,[data-theme=dark] .btn.pri{color:#0b1020}

.bar{height:6px;background:var(--bd);border-radius:9px;margin-top:4px;min-width:60px}.bar i{display:block;height:100%;border-radius:9px;background:var(--pri)}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.chip{border:1px solid var(--bd);background:var(--card);border-radius:99px;padding:5px 13px;cursor:pointer;font-weight:600;font-size:.88rem}.chip.on{background:var(--pri);color:#fff;border-color:var(--pri)}[data-theme=dark] .chip.on{color:#0b1020}
input,select,textarea{border:1px solid var(--bd);background:var(--card);border-radius:9px;padding:7px 10px;max-width:100%}textarea{width:100%;min-height:60px}
label{display:block;font-weight:600;font-size:.88rem;margin-bottom:10px}label>input:not([type=checkbox]),label>select,label>textarea{display:block;width:100%;margin-top:3px}
label.ck{display:flex;gap:8px;align-items:center;font-weight:500}
.fg{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:0 14px}
.warnbox{background:var(--warnbg);color:var(--warn);border-radius:10px;padding:8px 12px;font-size:.88rem;margin:8px 0}.note{font-size:.85rem;color:var(--mut)}

.calhead{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-bottom:8px}.calhead button{border:1px solid var(--bd);background:var(--card);border-radius:8px;padding:3px 10px;cursor:pointer}
.calgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}.calgrid .dw{text-align:center;font-size:.75rem;color:var(--mut);font-weight:700}

.cd b{font-size:.85rem}.cd span{font-size:.72rem;font-weight:700;white-space:nowrap}

.mbox{background:var(--card);border-radius:18px;width:min(640px,100%);padding:20px;box-shadow:0 20px 60px rgba(0,0,0,.4)}
.mh{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px}
.x{border:0;background:none;cursor:pointer;color:var(--mut);padding:4px}

.lockbox{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:28px;width:min(340px,92vw);text-align:center;box-shadow:var(--sh)}

.report .meta{display:grid;grid-template-columns:1fr 1fr;gap:3px 20px;margin:12px 0;border-top:2px solid #000;border-bottom:1px solid #000;padding:8px 0}
.report table{margin:6px 0 12px;font-size:12px}.report th,.report td{border:1px solid #444;padding:4px 6px;color:#000}.report th{background:#e5e7eb;color:#000}
.report h4{margin:12px 0 2px;font-size:13px}.report .tot{font-size:15px;font-weight:700;margin-top:10px}
.report .sign{display:flex;justify-content:space-between;margin-top:46px}.report .sign span{border-top:1px solid #000;padding-top:3px;min-width:160px;text-align:center}
@page{size:A4;margin:12mm}
@media print{
 body{background:#fff}.noprint,.side,.top,.bnav,#toast,#modal,#lock{display:none!important}

 .bnav a{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:9.5px;text-decoration:none;color:var(--mut);padding:4px 0;overflow:hidden;text-overflow:ellipsis}.bnav a.on{color:var(--pri);font-weight:700}
 .c5{grid-template-columns:1fr 1fr}.c2,.c21,.c3{grid-template-columns:minmax(0,1fr)}.top h1{font-size:1.25rem}
 .dl{grid-template-columns:110px 1fr}#toast{bottom:84px}
}

</style></head>
<body>
<div id="lock"></div>
<div id="app" class="shell" hidden>
 <aside class="side noprint"><div class="brand"><i>✓</i>My Attendance</div><nav id="nav"></nav>
  <div style="margin-top:auto" class="note">Private · stored only in this browser</div></aside>
 <div class="main">
  <header class="top noprint"><div style="display:flex;align-items:center;gap:10px;min-width:0"><button class="btn" id="backBtn" data-a="back" aria-label="Go back" title="Go back" hidden>←</button><h1 id="ttl"></h1></div>
   <div class="acts" style="margin:0"><button class="btn" data-a="theme" aria-label="Toggle light or dark theme">◐ Theme</button><button class="btn" id="lockBtn" data-a="lock" hidden>🔒 Lock</button><button class="btn pri" data-a="printGo">🖨 Print Attendance Report</button></div></header>
  <main id="view"></main>
 </div>
 <nav class="bnav noprint" id="bnav"></nav>
</div>
<div id="modal" data-a="closeBd" role="dialog" aria-modal="true"></div>
<div id="dlg" role="alertdialog" aria-modal="true"></div>

<input type="file" id="file" accept="application/json,.json" hidden>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script>
'use strict';
/* ================= helpers ================= */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today=()=>ymd(new Date());
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const MONL=['January','February','March','April','May','June','July','August','September','October','November','December'];
const validDate=s=>/^\d{4}-\d{2}-\d{2}$/.test(s)&&ymd(new Date(+s.slice(0,4),+s.slice(5,7)-1,+s.slice(8,10)))===s;
const fmtD=s=>{if(!s)return'—';const[y,m,d]=s.split('-');return`${d} ${MON[m-1]} ${y}`};
const fmtM=k=>{const[y,m]=k.split('-');return`${MON[m-1]} ${y}`};
const fmtT=t=>{if(!t)return'—';const[h,m]=t.split(':').map(Number);return`${pad(h%12||12)}:${pad(m)} ${h<12?'AM':'PM'}`};
const fmtTS=iso=>{const d=new Date(iso);return isNaN(d)?'—':`${pad(d.getDate())}-${pad(d.getMonth()+1)}-${d.getFullYear()} ${fmtT(pad(d.getHours())+':'+pad(d.getMinutes()))}`};
const str=(v,max)=>typeof v==='string'?v.replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g,'').slice(0,max).trim():'';
const num=v=>{if(v===null||v===''||typeof v==='boolean')return null;const n=Number(v);return Number.isFinite(n)?n:null};
const pct=(p,t)=>t>0?p/t*100:null;
const fp=v=>v==null?'—':v.toFixed(2)+'%';
const NOD='No attendance data available';
const IC={dash:'<rect width="7" height="9" x="3" y="3" rx="1"/><rect width="7" height="5" x="14" y="3" rx="1"/><rect width="7" height="9" x="14" y="12" rx="1"/><rect width="7" height="5" x="3" y="16" rx="1"/>',check:'<path d="m9 11 3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>',cal:'<rect width="18" height="18" x="3" y="4" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>',book:'<path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2zM22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>',print:'<path d="M6 9V2h12v7"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect width="12" height="8" x="6" y="14"/>',bar:'<path d="M12 20V10M18 20V4M6 20v-4"/>',set:'<path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/>'};
const ic=(n,s=18)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${IC[n]}</svg>`;
const NAV=[['dashboard','Dashboard','dash'],['attendance','Attendance','check'],['calendar','Calendar','cal'],['subjects','Subjects','book'],['reports','Reports','print'],['stats','Statistics','bar'],['settings','Settings','set']];

/* ================= data layer (swap Store for Firebase/Supabase later) ================= */
const DEF_SUBJ=[['100102','Engineering Mathematics - I','Theory'],['100104','Engineering Physics','Theory'],['100105','Introduction to AI','Theory'],['100108','Computer Fundamentals & Emerging Technologies','Theory'],['100109','Universal Human Values','Theory'],['100110','Essence of Indian Constitution','Theory'],['100111','Basics of Electrical & Electronics Engineering','Theory'],['100104P','Engineering Physics Lab','Lab'],['100111P','Basics of Electrical & Electronics Engineering Lab','Lab'],['100112P','Programming for Problem Solving Lab','Lab']];
const DEFAULT={student:{id:'me',name:'',registrationNumber:'',college:'Government Engineering College Lakhisarai',branch:'B.Tech CSE (Data Science)',batch:'2026–2030',semester:'I',session:'2026–2027'},
 subjects:DEF_SUBJ.map(([code,name,type],i)=>({id:'s'+(i+1),code,name,type})),attendance:[],
 settings:{targetPercentage:75,goodPercentage:80,locationVerificationEnabled:true,geofenceEnabled:false,geofenceRequired:false,collegeLatitude:'',collegeLongitude:'',geofenceRadius:200,theme:'system',semStart:'',semEnd:'',printShowLocation:true,printSignature:true},pin:null};
function sanitize(d,imp){
 if(!d||typeof d!=='object'||Array.isArray(d))throw new Error('Not a valid backup file');
 const o=structuredClone(DEFAULT),st=d.student&&typeof d.student==='object'?d.student:{};
 for(const k of Object.keys(o.student))if(k!=='id'&&typeof st[k]==='string')o.student[k]=str(st[k],120);
 const se=d.settings&&typeof d.settings==='object'?d.settings:{};
 for(const k of Object.keys(o.settings)){const dv=o.settings[k],v=se[k];
  if(typeof dv==='boolean'){if(typeof v==='boolean')o.settings[k]=v}
  else if(typeof dv==='number'){const n=num(v);if(n!==null)o.settings[k]=n}
  else if(typeof v==='string'||typeof v==='number')o.settings[k]=String(v).slice(0,40)}
 if(!['system','light','dark'].includes(o.settings.theme))o.settings.theme='system';
 o.settings.targetPercentage=Math.min(100,Math.max(1,o.settings.targetPercentage));o.settings.goodPercentage=Math.min(100,Math.max(o.settings.targetPercentage,o.settings.goodPercentage));
 if(!validDate(o.settings.semStart))o.settings.semStart='';if(!validDate(o.settings.semEnd))o.settings.semEnd='';
 if(Array.isArray(d.subjects)){const seen=new Set();o.subjects=[];
  for(const s of d.subjects.slice(0,200)){if(!s||typeof s!=='object')continue;const name=str(s.name,100);if(!name)continue;let id=str(s.id,40)||uid();if(seen.has(id))id=uid();seen.add(id);o.subjects.push({id,code:str(s.code,20),name,type:s.type==='Lab'?'Lab':'Theory'})}}
 const ids=new Set(o.subjects.map(s=>s.id)),rs=new Set();
 if(Array.isArray(d.attendance)){for(const r of d.attendance.slice(0,20000)){if(!r||typeof r!=='object')continue;
  if(typeof r.date!=='string'||!validDate(r.date)||!['present','absent'].includes(r.status)||!ids.has(r.subjectId))continue;
  let id=str(r.id,40)||uid();if(rs.has(id))id=uid();rs.add(id);
  const period=Number.isInteger(r.period)&&r.period>=1&&r.period<=20?r.period:1,tm=t=>typeof t==='string'&&/^([01]\d|2[0-3]):[0-5]\d$/.test(t)?t:'';
  const la=num(r.latitude),lo=num(r.longitude),hasC=la!==null&&lo!==null&&Math.abs(la)<=90&&Math.abs(lo)<=180,ac=num(r.accuracy);
  o.attendance.push({id,date:r.date,subjectId:r.subjectId,period,status:r.status,startTime:tm(r.startTime),endTime:tm(r.endTime),
   timestamp:typeof r.timestamp==='string'&&!isNaN(new Date(r.timestamp))?r.timestamp:'',locationVerified:r.locationVerified===true&&hasC,
   latitude:hasC?la:null,longitude:hasC?lo:null,accuracy:hasC&&ac!==null&&ac>=0?ac:null,geofence:['inside','outside'].includes(r.geofence)?r.geofence:'',note:str(r.note,500)})}}
 if(!imp&&d.pin&&typeof d.pin.h==='string'&&typeof d.pin.s==='string'){o.pin={h:d.pin.h.slice(0,128),s:d.pin.s.slice(0,64)};if(typeof d.pin.rh==='string'&&typeof d.pin.rs==='string'){o.pin.rh=d.pin.rh.slice(0,128);o.pin.rs=d.pin.rs.slice(0,64)}if(typeof d.pin.em==='string')o.pin.em=str(d.pin.em,120)}
 return o}
const Store={key:'gec_attendance_v1',
 load(){try{const r=localStorage.getItem(this.key);if(r)return sanitize(JSON.parse(r))}catch(e){console.warn('Load failed',e)}return structuredClone(DEFAULT)},
 save(){try{localStorage.setItem(this.key,JSON.stringify(S))}catch(e){toast('Could not save — browser storage is full or blocked','err')}}};
let S=Store.load();

/* ================= calculations ================= */
const subj=id=>S.subjects.find(s=>s.id===id);
const cmpAsc=(a,b)=>a.date===b.date?a.period-b.period:a.date<b.date?-1:1;
function filt(recs,{from,to,subj:sj}={}){return recs.filter(r=>(!from||r.date>=from)&&(!to||r.date<=to)&&(!sj||r.subjectId===sj))}
function tally(recs){const p=recs.filter(r=>r.status==='present').length;return{p,a:recs.length-p,t:recs.length,pct:pct(p,recs.length)}}
const bySubject=recs=>S.subjects.map(s=>({s,...tally(recs.filter(r=>r.subjectId===s.id))}));
const monthKeys=recs=>[...new Set(recs.map(r=>r.date.slice(0,7)))].sort();
function level(v){const t=S.settings.targetPercentage,g=S.settings.goodPercentage;if(v==null)return{k:'none',t:'No data',i:'–',msg:NOD};if(v<t)return{k:'low',t:'Low',i:'▼',msg:'Attendance below target'};if(v<=g)return{k:'near',t:'Near',i:'●',msg:'Attendance near target'};return{k:'good',t:'Good',i:'✔',msg:'Attendance on track'}}
const tag=v=>{const l=level(v);return`<span class="tag ${l.k}" title="${l.msg}">${l.i} ${l.t}</span>`};
function need(p,t,T){if(t===0)return null;if(p/t*100>=T)return 0;if(T>=100)return Infinity;return Math.ceil((T*t-100*p)/(100-T)-1e-9)}
const canMiss=(p,t,T)=>{if(t===0||T<=0||p/t*100<T)return 0;return Math.max(0,Math.floor(100*p/T-t+1e-9))};
const needTxt=n=>n===null?'—':n===0?'Target reached ✔':n===Infinity?'Not reachable at 100% target':`${n} class${n>1?'es':''} in a row`;
const locLabel=r=>r.locationVerified?'Location Verified':'Location Not Verified';
function nextPeriod(date){const u=new Set(S.attendance.filter(r=>r.date===date).map(r=>r.period));for(let i=1;i<=20;i++)if(!u.has(i))return i;return 0}
const hav=(a,b,c,d)=>{const R=6371000,t=x=>x*Math.PI/180,dl=t(c-a),dn=t(d-b),h=Math.sin(dl/2)**2+Math.cos(t(a))*Math.cos(t(c))*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.sqrt(h))};
const geoCfg=()=>{const s=S.settings,la=num(s.collegeLatitude),lo=num(s.collegeLongitude);return s.geofenceEnabled&&la!==null&&lo!==null&&Math.abs(la)<=90&&Math.abs(lo)<=180?{la,lo,r:s.geofenceRadius}:null};

/* ================= date range ================= */
let R={preset:'semester',from:'',to:''};
function rangeOf(p){const n=new Date(),t=ymd(n);
 if(p==='today')return[t,t];
 if(p==='week'){const d=new Date(n);d.setDate(d.getDate()-(d.getDay()+6)%7);const e=new Date(d);e.setDate(d.getDate()+6);return[ymd(d),ymd(e)]}
 if(p==='month')return[ymd(new Date(n.getFullYear(),n.getMonth(),1)),ymd(new Date(n.getFullYear(),n.getMonth()+1,0))];
 if(p==='lastmonth')return[ymd(new Date(n.getFullYear(),n.getMonth()-1,1)),ymd(new Date(n.getFullYear(),n.getMonth(),0))];
 if(p==='semester')return[S.settings.semStart,S.settings.semEnd];
 if(p==='all')return['',''];return[R.from,R.to]}
const curRange=()=>{if(R.preset==='custom')return{from:R.from,to:R.to};const[from,to]=rangeOf(R.preset);return{from,to}};
function rangeBar(){const P=[['today','Today'],['week','This Week'],['month','This Month'],['lastmonth','Last Month'],['semester','Semester'],['all','All time'],['custom','Custom Range']];const{from,to}=curRange();
 return`<div class="card noprint"><div class="chips">${P.map(([k,l])=>`<button class="chip ${R.preset===k?'on':''}" data-a="preset" data-v="${k}" aria-pressed="${R.preset===k}">${l}</button>`).join('')}</div>
 <div class="fg" style="max-width:520px"><label>From<input type="date" data-ch="rFrom" value="${esc(from)}"></label><label>To<input type="date" data-ch="rTo" value="${esc(to)}"></label></div>
 <div class="note">Showing: ${from||to?`${from?fmtD(from):'beginning'} → ${to?fmtD(to):'latest'}`:'all records'}${R.preset==='semester'&&!from&&!to?' (set semester dates in Settings to narrow it)':''}</div></div>`}

/* ================= UI plumbing ================= */

const chart=(id,cfg)=>Q.push([id,cfg]);
function flushCharts(){CH.forEach(c=>c.destroy());CH.length=0;if(typeof Chart==='undefined'){Q=[];return}
 const cs=getComputedStyle(document.documentElement);Chart.defaults.color=cs.getPropertyValue('--mut').trim();Chart.defaults.borderColor=cs.getPropertyValue('--bd').trim();
 Q.forEach(([id,cfg])=>{const el=document.getElementById(id);if(el)CH.push(new Chart(el,cfg))});Q=[]}
const OK='#10b981',BAD='#ef4444',PRI='#6366f1',WARN='#f59e0b';
const yPct={min:0,max:100,ticks:{callback:v=>v+'%'}};
const cvs=(id,cls='cwrap')=>`<div class="${cls}"><canvas id="${id}" role="img" aria-label="${id} chart"></canvas></div>`;
let toastT;function toast(m,type,ms=3200){const t=$('#toast');t.textContent=m;t.className='on '+(type||'');clearTimeout(toastT);if(ms)toastT=setTimeout(()=>t.className='',ms)}
let curMap=null;
function openModal(html){const m=$('#modal');m.innerHTML=`<div class="mbox">${html}</div>`;m.classList.add('on')}
function ask(msg,o={}){return new Promise(res=>{const d=$('#dlg');d.innerHTML=`<div class="mbox" style="width:min(420px,100%)"><p style="white-space:pre-line;margin:0 0 16px">${esc(msg)}</p><div class="acts" style="justify-content:flex-end;margin:0"><button class="btn" data-k="0">Cancel</button><button class="btn ${o.danger?'bad':'pri'}" data-k="1">${esc(o.ok||'OK')}</button></div></div>`;d.classList.add('on');
 const done=v=>{d.classList.remove('on');d.innerHTML='';d.onclick=null;d.onkeydown=null;res(v)};d.onclick=e=>{const k=e.target.closest('[data-k]');if(k)done(k.dataset.k==='1');else if(e.target===d)done(false)};d.onkeydown=e=>{if(e.key==='Escape')done(false)};d.querySelector('[data-k="1"]').focus()})}
function closeModal(){if(curMap){curMap.remove();curMap=null}$('#modal').classList.remove('on');$('#modal').innerHTML=''}
const badge=s=>`<span class="b ${s}">${s==='present'?'✓ Present':'✗ Absent'}</span>`;
const timeTxt=r=>r.startTime&&r.endTime?`${fmtT(r.startTime)} – ${fmtT(r.endTime)}`:r.startTime?fmtT(r.startTime):'—';
const sname=id=>{const s=subj(id);return s?esc(s.name):'(deleted subject)'};
function applyTheme(){let t=S.settings.theme;if(t==='system')t=matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light';document.documentElement.dataset.theme=t}
matchMedia('(prefers-color-scheme:dark)').addEventListener?.('change',()=>{if(S.settings.theme==='system'){applyTheme();render()}});
async function download(name,data,mime){
 try{if(window.claude&&claude.use){const d=await claude.use('downloads');if(d){try{await d.save({filename:name,data:data instanceof Uint8Array?data.slice(0):data});toast('File saved: '+name);return true}catch(e){if(e&&e.code==='declined'){toast('Save cancelled');return false}console.warn('downloads capability failed',e)}}}}catch(e){}
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:mime}));a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),2000);toast('File downloaded: '+name);return true}

  const mk=monthKeys(recs);chart('cMon',{type:'bar',data:{labels:mk.map(fmtM),datasets:[{label:'Present',data:mk.map(k=>recs.filter(r=>r.date.startsWith(k)&&r.status==='present').length),backgroundColor:OK},{label:'Absent',data:mk.map(k=>recs.filter(r=>r.date.startsWith(k)&&r.status==='absent').length),backgroundColor:BAD}]},options:{maintainAspectRatio:false,scales:{x:{stacked:true},y:{stacked:true,ticks:{precision:0}}}}});
  chart('cPA',{type:'doughnut',data:{labels:['Present','Absent'],datasets:[{data:[T.p,T.a],backgroundColor:[OK,BAD]}]},options:{maintainAspectRatio:false}})}
 const none=`<div class="empty">${NOD}</div>`;
 return`<div class="card"><div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap"><div><h2>${st.name?`Hi, ${esc(st.name)} 👋`:'Welcome 👋'}</h2><div class="mut">${esc(st.college)} · ${esc(st.branch)}</div><div class="mut">Reg. No: ${esc(st.registrationNumber)||'—'} · Semester ${esc(st.semester)} · Session ${esc(st.session)} · Batch ${esc(st.batch)}</div>${!st.name||!st.registrationNumber?'<div class="warnbox">Add your name and registration number in <a href="#/settings">Settings → Profile</a>.</div>':''}</div></div></div>
 ${rangeBar()}
 <div class="grid c5"><div class="card stat"><small>Overall Attendance</small>${T.t?`<div class="ring"><canvas id="cRing" role="img" aria-label="Overall attendance ${fp(T.pct)}"></canvas><div class="rt"><div><b>${fp(T.pct)}</b><br><span class="tag ${lv.k}">${lv.i} ${lv.t}</span></div></div></div>`:`<div class="empty" style="margin-top:8px">${NOD}</div>`}</div>
  ${stat('Present',T.p,'classes attended')}${stat('Absent',T.a,'classes missed')}${stat('Total Classes',T.t,'recorded')}${stat('Target',tg+'%',T.t?(nd===0?'Reached ✔':needTxt(nd)):'—')}</div>

 <div class="grid c3"><div class="card"><h3>${lv.i} Overall status</h3><p>${lv.msg}</p><p class="mut">${T.t?`Classes needed to reach ${tg}%: <b>${needTxt(nd)}</b>`:NOD}</p></div>
  <div class="card"><h3>▼ Below target (${low.length})</h3>${low.length?low.map(r=>`<div><a href="#/subject/${esc(r.s.id)}">${esc(r.s.name)}</a> — <b>${fp(r.pct)}</b> · Attendance below target</div>`).join(''):'<p class="mut">None 🎉</p>'}</div>
  <div class="card"><h3>✔ On track (above ${gd}%) (${good.length})</h3>${good.length?good.map(r=>`<div>${esc(r.s.name)} — <b>${fp(r.pct)}</b></div>`).join(''):'<p class="mut">None yet</p>'}</div></div>
 <div class="card"><h3>Subject-wise attendance</h3>${subjTable(rows)}</div>

SUB.subj=f=>{const fd=new FormData(f),name=str(String(fd.get('name')||''),100);if(!name)return toast('Subject name is required','err');const d={code:str(String(fd.get('code')||''),20),name,type:fd.get('type')==='Lab'?'Lab':'Theory'};
 if(f.dataset.id)Object.assign(subj(f.dataset.id),d);else S.subjects.push({id:uid(),...d});Store.save();closeModal();render();toast('Subject saved')};
SUB.profile=f=>{const fd=new FormData(f);for(const k of Object.keys(S.student))if(k!=='id'&&fd.has(k))S.student[k]=str(String(fd.get(k)),k==='registrationNumber'?40:120);Store.save();toast('Profile saved');render()};
SUB.targets=f=>{const fd=new FormData(f),t=num(fd.get('targetPercentage')),g=num(fd.get('goodPercentage')),a=String(fd.get('semStart')||''),b=String(fd.get('semEnd')||'');
 if(t===null||t<1||t>100||g===null||g<t||g>100)return toast('Target must be 1–100 and “on track” ≥ target','err');if((a&&!validDate(a))||(b&&!validDate(b))||(a&&b&&b<a))return toast('Check semester dates','err');
 Object.assign(S.settings,{targetPercentage:t,goodPercentage:g,semStart:a,semEnd:b});Store.save();toast('Saved');render()};
SUB.loc=f=>{const fd=new FormData(f),la=String(fd.get('collegeLatitude')||'').trim(),lo=String(fd.get('collegeLongitude')||'').trim(),rad=num(fd.get('geofenceRadius')),en=fd.has('geofenceEnabled');
 if(en&&(num(la)===null||Math.abs(num(la))>90||num(lo)===null||Math.abs(num(lo))>180))return toast('Enter valid college latitude (−90..90) and longitude (−180..180)','err');if(rad===null||rad<10||rad>50000)return toast('Radius must be 10–50000 m','err');
 Object.assign(S.settings,{locationVerificationEnabled:fd.has('locationVerificationEnabled'),geofenceEnabled:en,geofenceRequired:fd.has('geofenceRequired'),collegeLatitude:la,collegeLongitude:lo,geofenceRadius:rad});Store.save();toast('Saved');render()};
SUB.print=f=>{const fd=new FormData(f);S.settings.printShowLocation=fd.has('printShowLocation');S.settings.printSignature=fd.has('printSignature');Store.save();toast('Saved')};
async function hashPin(pin,salt){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(salt+':'+pin));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
const CODE_ABC='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
const normCode=c=>String(c||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
const rnd=n=>[...crypto.getRandomValues(new Uint8Array(n))].map(x=>x.toString(16).padStart(2,'0')).join('');
async function newRecovery(){const raw=[...crypto.getRandomValues(new Uint8Array(12))].map(x=>CODE_ABC[x%32]).join(''),rs=rnd(12);S.pin.rs=rs;S.pin.rh=await hashPin(raw,rs);Store.save();return raw.match(/.{4}/g).join('-')}
function showRecovery(code){const em=S.pin?.em||'',body=`Attendance tracker recovery code: ${code}\n\nUse "Forgot PIN?" on the lock screen and enter this code to remove the PIN. Your attendance data is not affected.`;
 openModal(`<div class="mh"><h3>🔑 Your recovery code</h3></div><p>Save this now — it is shown <b>only once</b>.</p><p style="font:700 1.5rem/1.3 ui-monospace,monospace;letter-spacing:.08em;text-align:center;background:var(--pri2);border-radius:12px;padding:14px;user-select:all">${esc(code)}</p>
 <p class="note">If you forget your PIN: lock screen → “Forgot PIN?” → enter this code. It removes the PIN only; no attendance data is deleted.</p><div class="acts"><button class="btn" data-a="copyCode" data-v="${esc(code)}">Copy</button>
 <a class="btn" href="mailto:${encodeURIComponent(em)}?subject=${encodeURIComponent('Attendance tracker recovery code')}&body=${encodeURIComponent(body)}">✉ Email it to myself</a><button class="btn pri" data-a="close">I have saved it</button></div>`)}
SUB.pin=async f=>{const fd=new FormData(f),pin=String(fd.get('pin')||''),em=str(String(fd.get('email')||''),120);if(!/^\d{4,8}$/.test(pin))return toast('PIN must be 4–8 digits','err');if(em&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em))return toast('Enter a valid email or leave it empty','err');if(!(window.crypto&&crypto.subtle))return toast('PIN needs a secure context (https or localhost) in this browser','err');
 const sl=rnd(12);S.pin={s:sl,h:await hashPin(pin,sl),em};const code=await newRecovery();render();showRecovery(code)};


/* ================= PDF export (no library; builds a real A4 PDF) ================= */
function buildPdf(){
 const el=$('#reportOut'),W=595,H=842,M=40,CW=W-2*M,pages=[];let ops,y;
 const newPage=()=>{ops=[];pages.push(ops);y=H-M};
 const enc=s=>{let o='';for(const ch of String(s)){let c=ch.charCodeAt(0);if(c===0x2013)c=0x96;else if(c===0x2014)c=0x97;else if(c===0xA0)c=32;else if(c>255||(c>126&&c<160))c=63;o+=String.fromCharCode(c)}return o.replace(/[\\()]/g,'\\$&')};
 const tw=(s,sz,b)=>String(s).length*sz*(b?.58:.52);
 const T=(s,x,yy,sz,b)=>ops.push(`BT /F${b?2:1} ${sz} Tf ${x.toFixed(1)} ${yy.toFixed(1)} Td (${enc(s)}) Tj ET`);
 const wrap=(s,w,sz,b)=>{const out=[];let l='';for(let wd of String(s).split(/\s+/)){while(tw(wd,sz,b)>w){const n=Math.max(1,Math.floor(w/(sz*(b?.58:.52))));if(l){out.push(l);l=''}out.push(wd.slice(0,n));wd=wd.slice(n)}const t=l?l+' '+wd:wd;if(tw(t,sz,b)>w&&l){out.push(l);l=wd}else l=t}out.push(l);return out};
 const ensure=h=>{if(y-h<M+16)newPage()};
 const line=(x1,y1,x2,y2,wd=.7)=>ops.push(`${wd} w ${x1} ${y1} m ${x2} ${y2} l S`);
 const para=(s,sz,b,align)=>{for(const l of wrap(s,CW,sz,b)){ensure(sz+4);y-=sz+2;T(l,align==='c'?M+(CW-tw(l,sz,b))/2:M,y,sz,b);y-=2}};
 function table(n){const hd=[...n.querySelectorAll('thead th')].map(t=>t.textContent.trim()),rows=[...n.querySelectorAll('tbody tr')].map(tr=>[...tr.children].map(c=>c.textContent.trim()));
  const wt=hd.map((h,i)=>Math.min(38,Math.max(6,h.length*.9,rows.reduce((a,r)=>a+(r[i]||'').length,0)/Math.max(1,rows.length))));const sum=wt.reduce((a,b)=>a+b,0),cw=wt.map(w=>w/sum*CW),sz=8.5,lh=11;
  const drawRow=(cells,bold,fill)=>{const lines=cells.map((c,i)=>wrap(c,cw[i]-6,sz,bold)),rh=Math.max(...lines.map(l=>l.length))*lh+6;
   if(y-rh<M+16){newPage();if(!fill)drawRow(hd,true,true)}
   let x=M;if(fill)ops.push(`0.9 g ${M} ${y-rh} ${CW} ${rh} re f 0 g`);
   cells.forEach((c,i)=>{ops.push(`0.5 w ${x} ${y-rh} ${cw[i]} ${rh} re S`);lines[i].forEach((l,k)=>T(l,x+3,y-lh*(k+1)+1.5,sz,bold));x+=cw[i]});y-=rh};
  y-=4;drawRow(hd,true,true);rows.forEach(r=>drawRow(r,false,false));y-=8}
 newPage();
 for(const n of el.children){
  if(n.tagName==='TABLE')table(n);
  else if(n.classList.contains('sub'))para(n.textContent.trim(),9,true,'c');
  else if(n.tagName==='H2')para(n.textContent.trim(),15,true,'c');
  else if(n.tagName==='H4')para(n.textContent.trim(),10.5,true);
  else if(n.classList.contains('meta')){y-=4;line(M,y,M+CW,y,1.4);y-=4;const k=[...n.children].map(c=>c.textContent.trim());for(let i=0;i<k.length;i+=2){const a=wrap(k[i],CW/2-8,9.5),b=k[i+1]?wrap(k[i+1],CW/2-8,9.5):[],h=Math.max(a.length,b.length)*12;ensure(h);a.forEach((l,j)=>T(l,M,y-12*(j+1)+2,9.5));b.forEach((l,j)=>T(l,M+CW/2,y-12*(j+1)+2,9.5));y-=h}y-=2;line(M,y,M+CW,y,.7);y-=6}
  else if(n.classList.contains('tot')){y-=4;para(n.textContent.trim(),12,true)}
  else if(n.classList.contains('sign')){ensure(70);y-=46;line(M,y,M+170,y);line(W-M-170,y,W-M,y);const t=[...n.children].map(c=>c.textContent.trim());T(t[0]||'',M+20,y-12,9);T(t[1]||'',W-M-170+10,y-12,9);y-=16}
  else para(n.textContent.trim().replace(/\s+/g,' '),10,false)}
 pages.forEach((p,i)=>{ops=p;const t=`Page ${i+1} of ${pages.length}`;T(t,M+(CW-tw(t,8))/2,22,8)});
 const objs=[];const add=s=>{objs.push(s);return objs.length};
 add('<< /Type /Catalog /Pages 2 0 R >>');add('');add('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>');add('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>');
 const kids=[];pages.forEach((p,i)=>{const body=p.join('\n'),c=5+2*i;add(`<< /Length ${body.length} >>\nstream\n${body}\nendstream`);add(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${W} ${H}] /Resources << /Font << /F1 3 0 R /F2 4 0 R >> >> /Contents ${c} 0 R >>`);kids.push(`${c+1} 0 R`)});
 objs[1]=`<< /Type /Pages /Kids [${kids.join(' ')}] /Count ${pages.length} >>`;
 let out='%PDF-1.4\n';const off=[];objs.forEach((o,i)=>{off.push(out.length);out+=`${i+1} 0 obj\n${o}\nendobj\n`});
 const xr=out.length;out+=`xref\n0 ${objs.length+1}\n0000000000 65535 f \n`+off.map(o=>String(o).padStart(10,'0')+' 00000 n \n').join('')+`trailer\n<< /Size ${objs.length+1} /Root 1 0 R >>\nstartxref\n${xr}\n%%EOF`;
 const u=new Uint8Array(out.length);for(let i=0;i<out.length;i++)u[i]=out.charCodeAt(i)&255;return u}
function downloadPdf(){if(!$('#reportOut'))return;const u=buildPdf();download(`attendance-report-${today()}.pdf`,u,'application/pdf')}

 <div style="margin-top:14px"><button class="btn" id="es" style="width:100%;justify-content:center">✉ Email me a verification code</button><div class="note" id="ee" role="status" style="margin-top:6px">Sends an 8-digit code to your recovery Gmail (needs the hosted site).</div>
 <div id="eo" hidden><label>8-digit code from your email<input id="ec" inputmode="numeric" maxlength="8" autocomplete="one-time-code"></label><button class="btn pri" id="ev" style="width:100%;justify-content:center">Verify email code &amp; remove PIN</button></div></div>
 <hr style="border:0;border-top:1px solid var(--bd);margin:16px 0"><p class="note">${has?'Lost the code too?':'Use this option:'} You can still remove the PIN without deleting any data. This app has no server, so it cannot email you; anyone using this device could do the same, because the PIN is only a casual privacy lock (it does not encrypt your data).</p>
 <button class="btn bad" id="rm" style="width:100%;justify-content:center" disabled>Remove PIN anyway (wait 15s)</button><p style="text-align:center;margin:12px 0 0"><button class="btn sm" data-a="unlockBack">← Back to PIN</button></p></div>`;
 const done=m=>{clearInterval(recTimer);S.pin=null;Store.save();L_.className='';L_.innerHTML='';boot();toast(m,'',7000)};
 let t=15;const rm=$('#rm');recTimer=setInterval(()=>{t--;if(!document.body.contains(rm)){clearInterval(recTimer);return}if(t<=0){clearInterval(recTimer);rm.disabled=false;rm.textContent='Remove PIN (keep my data)'}else rm.textContent=`Remove PIN anyway (wait ${t}s)`},1000);
 const es=$('#es'),ee=$('#ee');clearInterval(otpCool);
 es.onclick=async()=>{es.disabled=true;ee.textContent='Sending…';try{const r=await fetch('/.netlify/functions/send-otp',{method:'POST'}),j=await r.json().catch(()=>({}));
  if(r.ok&&j.token){otpTok=j.token;$('#eo').hidden=false;$('#ec').focus();ee.textContent='Code sent to your recovery email. It is valid for 10 minutes. Check Spam too.';let c=60;es.textContent=`Resend in ${c}s`;otpCool=setInterval(()=>{c--;if(!document.body.contains(es)){clearInterval(otpCool);return}if(c<=0){clearInterval(otpCool);es.disabled=false;es.textContent='✉ Send a new code'}else es.textContent=`Resend in ${c}s`},1000);return}
  ee.textContent=(r.status===404||j.error==='not_configured')?'Email verification is not set up on this site yet. Use the recovery code instead.':'Could not send the email right now. Try again later or use the recovery code.'}catch{ee.textContent='Email verification works only on the hosted website with internet. Use the recovery code instead.'}es.disabled=false};
 $('#ev').onclick=async()=>{const code=$('#ec').value.trim();if(!/^\d{8}$/.test(code)){ee.textContent='Enter the 8-digit code.';return}ee.textContent='Checking…';try{const r=await fetch('/.netlify/functions/verify-otp',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({code,token:otpTok})}),j=await r.json().catch(()=>({}));if(r.ok&&j.ok)done('Email verified — PIN removed. Your attendance data is untouched. Set a new PIN in Settings.');else ee.textContent=j.error==='expired'?'That code has expired. Send a new one.':'That code is not correct.'}catch{ee.textContent='Could not reach the server. Try again.'}};
 rm.onclick=()=>done('PIN removed. Your attendance data is untouched — set a new PIN in Settings if you want.');
 if(has){const v=async()=>{try{const raw=normCode($('#rc').value);if(raw.length===12&&await hashPin(raw,S.pin.rs)===S.pin.rh)done('Code accepted — PIN removed. Your attendance data is untouched. Set a new PIN in Settings.');else $('#re').textContent='That code is not correct'}catch{$('#re').textContent='Could not verify in this browser context'}};$('#rv').onclick=v;$('#rc').onkeydown=e=>{if(e.key==='Enter')v()};$('#rc').focus()}}
function boot(){$('#app').hidden=false;applyTheme();if(!location.hash)location.hash='#/dashboard';render()}
applyTheme();S.pin?showLock():boot();
</script>
</body></html>
